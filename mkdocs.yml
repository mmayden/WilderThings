site_name: WilderThings
site_description: Comprehensive wilderness survival guide — offline-ready, mobile-first
site_author: WilderThings Contributors
site_url: https://mmayden.github.io/WilderThings/
copyright: >
  Guides licensed
  <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="license">CC BY-SA 4.0</a>
  &middot; tooling MIT &middot; &copy; WilderThings Contributors &mdash;
  reference material, not a substitute for training or professional medical care.

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon-32.png
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/compass-rose
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate

extra:
  manifest: manifest.webmanifest

extra_css:
  - assets/css/custom.css

plugins:
  - search
  - tags
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  - toc:
      permalink: true

